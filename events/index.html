<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111720">
    <meta name="description" content="Browse HKSN’s past events and photo galleries, from welcome parties and dim sum to hikes and our annual semi-formal.">
    <title>Events — HKSN</title>
    <link rel="icon" type="image/png" href="../assets/logo/logo.png">
    <link rel="preload" href="../assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/links.css">
    <link rel="stylesheet" href="../styles/events.css">
    <link rel="stylesheet" href="../styles/modals.css">
    <link rel="stylesheet" href="../styles/footer.css">
</head>
<body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="include-navbar"></div>
    <main id="main-content" class="page-main">
        <header class="page-header site-container events-header">
            <div>
                <h1>Events</h1>
                <p class="body-large">Browse past HKSN events and photo galleries, including our welcome parties, cultural celebrations, and semi-formal.</p>
            </div>
            <aside class="next-event-note" aria-label="Upcoming event announcements">
                <p class="eyebrow">Upcoming events</p>
                <p>Follow HKSN on Instagram for event dates and announcements.</p>
                <a href="https://www.instagram.com/hksnmcgill/" class="text-link" target="_blank" rel="noopener noreferrer">Instagram <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a>
            </aside>
        </header>
        <section class="archive-section site-container" aria-labelledby="archive-title">
            <div class="archive-heading"><h2 id="archive-title">Past events</h2><span class="small-label" data-events-year>2024–25</span></div>
            <div class="archive-toolbar">
                <div class="event-filters" role="group" aria-label="Filter past events">
                    <button type="button" class="filter-button" data-event-filter="all" aria-pressed="true" aria-controls="events-grid">All events</button>
                    <button type="button" class="filter-button" data-event-filter="Community" aria-pressed="false" aria-controls="events-grid">Community</button>
                    <button type="button" class="filter-button" data-event-filter="Culture" aria-pressed="false" aria-controls="events-grid">Culture</button>
                    <button type="button" class="filter-button" data-event-filter="Nights out" aria-pressed="false" aria-controls="events-grid">Nights out</button>
                </div>
                <p id="events-count" class="small-label" role="status" aria-live="polite"></p>
            </div>
            <div id="events-grid" class="events-grid" data-event-grid aria-busy="true"><p class="content-status" role="status">Loading the event archive…</p></div>
            <noscript><p class="noscript-notice">Enable JavaScript to browse the photo archive, or find our event recaps on <a href="https://www.instagram.com/hksnmcgill/">Instagram</a>.</p></noscript>
        </section>
    </main>
    <div id="events-modals"></div>
    <div id="include-footer"></div>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/config.js"></script>
    <script defer src="../js/content.js"></script>
    <script defer src="../js/loaderComponents.js"></script>
    <script defer src="../js/loaderEventModals.js"></script>
    <script defer src="../js/loaderEvents.js"></script>
</body>
</html>
